[workspace]
resolver = "3"
members = [
    "crates/core",
    "cli",
    "desktop/src-tauri",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
reqwest = { version = "0.13.4", features = ["json"] }
thiserror = "2"
anyhow = "1.0.104"
portable-pty = "0.9"
git2 = "0.20"
tokio = { version = "1", features = ["full"] }
alacritty_terminal = "0.26"